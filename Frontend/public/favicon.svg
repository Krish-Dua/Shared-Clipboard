<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" filter="url(#shadow)" />

  <!-- Clipboard Board Outline -->
  <rect x="15" y="16" width="34" height="38" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="2.5" />

  <!-- Inner Document -->
  <rect x="20" y="22" width="24" height="26" rx="3" fill="#ffffff" />

  <!-- Document Lines -->
  <line x1="25" y1="28" x2="39" y2="28" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" />
  <line x1="25" y1="34" x2="35" y2="34" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" />
  <line x1="25" y1="40" x2="38" y2="40" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" />

  <!-- Clipboard Clip Top -->
  <rect x="24" y="11" width="16" height="8" rx="3.5" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
  <circle cx="32" cy="15" r="1.5" fill="#4f46e5" />
</svg>